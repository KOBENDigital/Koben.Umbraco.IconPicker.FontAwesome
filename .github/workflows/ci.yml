name: Continuous integration

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/Koben.Umbraco.IconPicker.FontAwesome.Backoffice/package-lock.json

      - name: Install backoffice dependencies
        working-directory: src/Koben.Umbraco.IconPicker.FontAwesome.Backoffice
        run: npm ci

      - name: Test backoffice assets
        working-directory: src/Koben.Umbraco.IconPicker.FontAwesome.Backoffice
        run: npm test

      - name: Restore .NET dependencies
        run: dotnet restore src/Koben.Umbraco.IconPicker.FontAwesome.slnx

      - name: Build solution
        run: dotnet build src/Koben.Umbraco.IconPicker.FontAwesome.slnx --configuration Release --no-restore

      - name: Test .NET projects
        run: dotnet test src/Koben.Umbraco.IconPicker.FontAwesome.slnx --configuration Release --no-build --no-restore

      - name: Create and validate NuGet packages
        run: |
          dotnet pack src/Koben.Umbraco.IconPicker.FontAwesome.Core/Koben.Umbraco.IconPicker.FontAwesome.Core.csproj --configuration Release --no-build --no-restore --output artifacts
          dotnet pack src/Koben.Umbraco.IconPicker.FontAwesome.Backoffice/Koben.Umbraco.IconPicker.FontAwesome.Backoffice.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
